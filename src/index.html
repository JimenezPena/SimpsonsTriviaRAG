<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simpsons RAG Trivia</title>
    <style>
      :root {
        --yellow: #ffd90f;
        --blue: #3a63ad;
        --bg: #f7f4ea;
        --card: #ffffff;
        --text: #1c2430;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #464a52 url("images/WallpaperDonut.jpg") center / cover fixed no-repeat;
        color: var(--text);
      }
      header {
        padding: 16px 24px;
        border-bottom: 4px solid var(--blue);
        display: flex;
        flex-direction: column;      /* logo on top, text centered below */
        align-items: center;
        gap: 8px;
        background: var(--yellow);
      }
      header h1 { margin: 0; font-size: 26px; text-align: center; }
      /* 👉 LOGO SIZE: adjust the height here */
      header img.logo { height: 110px; border-radius: 8px; }
      header .controls { margin-left: auto; display: flex; align-items: center; gap: 8px; }
      select, button {
        font: inherit;
        padding: 8px 14px;
        border-radius: 8px;
        border: 2px solid var(--blue);
        background: #fff;
        cursor: pointer;
      }
      main { max-width: 780px; margin: 24px auto; padding: 0 16px; }
      .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
      .tabs button.active { background: var(--blue); color: #fff; }
      .card {
        background: rgba(255, 255, 255, 0.94);
        border: 2px solid var(--blue);
        border-radius: 12px;
        padding: 20px;
        min-height: 120px;
      }
      .loading {
        display: flex;
        flex-direction: column;      /* text line first, Homer below it */
        align-items: center;
        gap: 12px;
        color: #555;
        font-style: italic;
      }
      /* 👉 HOMER GIF SIZE: adjust the height here */
      .loading img { height: 260px; border-radius: 8px; }
      .options { display: grid; gap: 8px; margin-top: 16px; }
      .options button { text-align: left; }
      .options button.correct { background: #c8f7c5; border-color: #2e7d32; }
      .options button.wrong { background: #f7c5c5; border-color: #c62828; }
      .options button:disabled { cursor: default; opacity: 0.9; }
      .verdict { margin-top: 14px; font-weight: bold; }
      .verdict.ok { color: #2e7d32; }
      .verdict.ko { color: #c62828; }
      .funfact { margin-top: 8px; color: #555; }
      .source { margin-top: 10px; font-size: 13px; color: #777; }
      .askbox { display: flex; gap: 8px; }
      .askbox input { flex: 1; padding: 10px; border: 2px solid var(--blue); border-radius: 8px; font: inherit; }
      .answer { margin-top: 16px; line-height: 1.5; }
      .sources { margin-top: 16px; font-size: 13px; }
      .sources details { margin-top: 6px; }
      .sources summary { cursor: pointer; color: var(--blue); }
      .sources pre { background: #f4f4f4; padding: 8px; overflow-x: auto; white-space: pre-wrap; }
      /* 👉 INSTAGRAM CLIP SIZE: the three variables below are the knobs.
         Width 100% = same width as the quiz answers (the card's inner width);
         lower --clip-max-width (e.g. 360px) for a narrower clip, and raise
         or lower --clip-height to fit the video (Instagram centres its player
         inside the frame, so a tall frame leaves empty space below it). */
      #clipBox {
        --clip-width: 100%;
        --clip-max-width: 100%;
        --clip-height: 640px;
      }
      #clipBox iframe {
        display: block;
        width: var(--clip-width);
        max-width: var(--clip-max-width);
        height: var(--clip-height);
        border: 0;
        margin: 12px auto 0;
      }
      .error { color: #c62828; margin-top: 12px; }
      .hint { color: #777; font-size: 13px; }
    </style>
  </head>
  <body>
    <header>
      <img class="logo" src="images/LogoSimpsons.jpg" alt="The Simpsons" />
      <h1 data-i18n="title">RAG Trivia</h1>
      <div class="controls">
        <button id="langToggle">🇪🇸 ES</button>
      </div>
    </header>

    <main>
      <div class="tabs">
        <button id="tabTrivia" class="active" data-i18n="tabTrivia">🎯 Trivia</button>
        <button id="tabAsk" data-i18n="tabAsk">💬 Ask anything</button>
      </div>

      <!-- TRIVIA TAB -->
      <section id="triviaPanel">
        <div class="card" id="triviaCard">
          <button id="newQuestion" data-i18n="newQuestion">New question</button>
          <p class="hint" data-i18n="triviaHint">Generates a question from a random chunk of the vector DB.</p>
          <div id="triviaBody"></div>
        </div>
      </section>

      <!-- ASK TAB -->
      <section id="askPanel" style="display:none">
        <div class="card">
          <div class="askbox">
            <input id="askInput" data-i18n-placeholder="askPlaceholder" placeholder="e.g. What pet did Lisa have..." />
            <button id="askSend" data-i18n="ask">Ask</button>
          </div>
          <div id="askBody"></div>
        </div>
      </section>
    </main>

    <script>
      const $ = (id) => document.getElementById(id);

      // ---- interface language ----
      let LANG = "es";
      const I18N = {
        es: {
          title: "RAG Trivia",
          tabTrivia: "🎯 Trivia", tabAsk: "💬 Pregunta lo que quieras",
          newQuestion: "Nueva pregunta",
          triviaHint: "Genera una pregunta a partir de un fragmento de un episodio, con su clip.",
          askPlaceholder: "p. ej. ¿Qué mascota tenía Lisa...?", ask: "Preguntar",
          generating: "Generando pregunta (LLM)…", retrieving: "Buscando fragmentos y pensando…",
          langChanged: "Has cambiado de idioma: los clips dependen del idioma, pulsa «Nueva pregunta».",
          correct: "🎉 ¡Correcto!", wrong: "😢 ¡Fallo!",
          season: "T", watch: "Ver en Instagram",
          distance: "distancia", sent: "enviado", notSent: "no enviado",
          requestFailed: "la petición ha fallado",
          noClips: "Todavía no hay clips con audio en castellano.",
        },
        en: {
          title: "RAG Trivia",
          tabTrivia: "🎯 Trivia", tabAsk: "💬 Ask anything",
          newQuestion: "New question",
          triviaHint: "Generates a question from an episode fragment, with its clip.",
          askPlaceholder: "e.g. What pet did Lisa have...", ask: "Ask",
          generating: "Generating question (LLM)…", retrieving: "Retrieving chunks and thinking…",
          langChanged: "Language changed: clips depend on the language, press “New question”.",
          correct: "🎉 Correct!", wrong: "😢 Wrong!",
          season: "S", watch: "Watch on Instagram",
          distance: "distance", sent: "sent", notSent: "not sent",
          requestFailed: "request failed",
          noClips: "There are no clips with English audio yet.",
        },
      };
      const t = (key) => I18N[LANG][key];

      function applyLang() {
        document.documentElement.lang = LANG;
        document.querySelectorAll("[data-i18n]").forEach((el) => (el.textContent = t(el.dataset.i18n)));
        document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => (el.placeholder = t(el.dataset.i18nPlaceholder)));
        $("langToggle").textContent = LANG === "es" ? "🇪🇸 ES" : "🇬🇧 EN";
      }

      // ---- Homer thinking gif while the LLM works ----
      const HOMER_GIFS = [
        "images/HomerThinkingOne.gif",
        "images/HomerThinkingTwo.gif",
        "images/HomerThinkingThree.gif",
        "images/HomerThinkingFour.gif",
      ];
      const thinking = (text) => {
        const gif = HOMER_GIFS[Math.floor(Math.random() * HOMER_GIFS.length)];
        // text line on top, Homer gif right below it
        return `<div class="loading"><span>${text}</span><img src="${gif}" alt="Homer thinking" /></div>`;
      };

      // ---- tabs ----
      function showTab(tab) {
        const trivia = tab === "trivia";
        $("tabTrivia").classList.toggle("active", trivia);
        $("tabAsk").classList.toggle("active", !trivia);
        $("triviaPanel").style.display = trivia ? "" : "none";
        $("askPanel").style.display = trivia ? "none" : "";
      }
      $("tabTrivia").onclick = () => showTab("trivia");
      $("tabAsk").onclick = () => showTab("ask");

      // ---- trivia ----
      let currentQ = null;   // question on screen that has NOT been revealed yet

      $("langToggle").onclick = () => {
        LANG = LANG === "es" ? "en" : "es";
        applyLang();
        // The clip shown on reveal must match the interface language, and the
        // pending question was drawn for the other one: drop it. A question
        // that was already answered stays on screen as it is.
        if (currentQ) {
          currentQ = null;
          $("triviaBody").innerHTML = `<p class="hint">${t("langChanged")}</p>`;
        }
      };

      async function newQuestion() {
        const body = $("triviaBody");
        currentQ = null;
        body.innerHTML = thinking(t("generating"));
        try {
          const res = await fetch("/api/trivia", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ mode: "clips", lang: LANG }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.code === "no_clips" ? t("noClips") : (data.error || t("requestFailed")));
          currentQ = data;
          renderTrivia(data);
        } catch (e) {
          body.innerHTML = `<p class="error">⚠️ ${e.message}</p>`;
        }
      }

      function renderTrivia(data) {
        const tr = data[LANG] || data.es;
        const body = $("triviaBody");
        const buttons = tr.options
          .map((o) => `<button onclick="reveal('${data.qid}','${o[0]}',this)">${o}</button>`)
          .join("");
        body.innerHTML = `
          <p><strong>${tr.question}</strong></p>
          <div class="options">${buttons}</div>
          <p class="verdict" id="verdict"></p>
          <p class="funfact" id="funfact"></p>
          <p class="source" id="source"></p>
          <div id="clipBox"></div>`;
      }

      async function reveal(qid, guess, clicked) {
        currentQ = null;     // answered: a later language switch keeps the result
        const buttons = $("triviaBody").querySelectorAll(".options button");
        buttons.forEach((b) => (b.disabled = true));
        try {
          const res = await fetch("/api/trivia/reveal", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ qid, guess, lang: LANG }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || t("requestFailed"));
          buttons.forEach((b) => {
            if (b.textContent[0] === data.answer.trim()[0].toUpperCase()) b.classList.add("correct");
            else if (b === clicked) b.classList.add("wrong");
          });
          const v = $("verdict");
          v.textContent = data.correct ? t("correct") : t("wrong");
          v.className = "verdict " + (data.correct ? "ok" : "ko");
          $("funfact").textContent = data.fun_fact ? "💡 " + data.fun_fact : "";
          if (data.source)
            $("source").textContent = `📺 ${t("season")}${data.source.season} — ${data.source.title}`;
          if (data.shortcode) {
            $("clipBox").innerHTML = `
              <iframe src="https://www.instagram.com/reel/${data.shortcode}/embed"
                      scrolling="no" allowtransparency="true"></iframe>
              <p class="hint"><a href="${data.ig_url}" target="_blank" rel="noopener">${t("watch")}</a></p>`;
          }
        } catch (e) {
          $("verdict").innerHTML = `<span class="error">⚠️ ${e.message}</span>`;
        }
      }

      $("newQuestion").onclick = newQuestion;
      applyLang();

      // ---- ask anything ----
      async function askQuestion() {
        const question = $("askInput").value.trim();
        if (!question) return;
        const body = $("askBody");
        body.innerHTML = thinking(t("retrieving"));
        try {
          const res = await fetch("/api/ask", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question, lang: LANG }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || t("requestFailed"));
          body.innerHTML = `<div class="answer">💬 ${data.answer}</div><div class="sources"></div>`;
          const src = body.querySelector(".sources");
          data.sources.forEach((s) => {
            const det = document.createElement("details");
            det.innerHTML = `
              <summary>[${s.rank}] ${t("season")}${s.season} — “${s.title}” (${t("distance")} ${s.distance})${s.sent_to_llm ? " → " + t("sent") : " · " + t("notSent")}</summary>
              <pre>${s.text}</pre>`;
            src.appendChild(det);
          });
        } catch (e) {
          body.innerHTML = `<p class="error">⚠️ ${e.message}</p>`;
        }
      }

      $("askSend").onclick = askQuestion;
      $("askInput").addEventListener("keydown", (e) => {
        if (e.key === "Enter") askQuestion();
      });
    </script>
  </body>
</html>
